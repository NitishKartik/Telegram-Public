name: Telegram Fleet Runner

on:
  workflow_dispatch:
    inputs:
      config_target:
        description: 'Which configuration job to run?'
        required: true
        default: '8am'
        type: choice
        options:
          - 10Limit
          - 4am
          - 4amOnly
          - 8am
          - 8amLike
          - dailyBonus
          - info_bot
          - info_bot_yogesh
          - like_report
          - like_report_yogesh
          - MultipleLikes
          - privateGroup
          - testCaptcha_no_ind
          - testCaptcha_ind

jobs:
  run-fleet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Like History
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.utils.history_artifacts restore

      - name: Restore Telegram Sessions
        env:
          SESSIONS_PART_1: ${{ secrets.SESSIONS_PART_1 }}
          SESSIONS_PART_2: ${{ secrets.SESSIONS_PART_2 }}
        run: |
          python -m src.utils.session_unpack

      - name: Execute Fleet Engine
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python main.py --time ${{ github.event.inputs.config_target }}

      - name: Save Like History Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: like-history
          path: data/like_history.json
          retention-days: 90

      - name: Upload Like Reports
        if: always() && (github.event.inputs.config_target == 'like_report' || github.event.inputs.config_target == 'like_report_yogesh')
        uses: actions/upload-artifact@v4
        with:
          name: like-reports
          path: data/reports/
          retention-days: 90

      - name: Commit and Push Updated Like Data
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/like_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update like history [skip ci]"
            git pull --rebase origin main
            git push
          fi
